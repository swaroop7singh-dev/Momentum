<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070908">
<title>Momentum — Habit Tracker</title>
<style>
:root{
  --bg:#070908;--bg2:#0c100d;--panel:rgba(20,25,21,.64);--panel2:rgba(12,16,13,.78);
  --line:rgba(255,255,255,.085);--text:#f5f7f1;--muted:#8f988f;
  --green:#39d353;--green2:#14863a;--whiteGlow:rgba(255,255,255,.09);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
background:
radial-gradient(900px 500px at 8% -5%,rgba(57,211,83,.13),transparent 60%),
radial-gradient(800px 500px at 100% 15%,rgba(88,166,255,.08),transparent 58%),
radial-gradient(650px 450px at 55% 100%,rgba(163,113,247,.055),transparent 65%),
linear-gradient(145deg,#050705,#0b0f0c 55%,#070907)}
button,input{font:inherit}button{cursor:pointer}
.app{width:min(1180px,100%);margin:auto;padding:18px 16px 60px}
.glass{background:linear-gradient(145deg,rgba(28,34,29,.72),rgba(11,15,12,.68));border:1px solid var(--line);
box-shadow:0 22px 70px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.045),0 0 0 1px rgba(57,211,83,.015);
backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
background:linear-gradient(135deg,rgba(57,211,83,.25),rgba(57,211,83,.035));border:1px solid rgba(57,211,83,.28);
box-shadow:0 0 32px rgba(57,211,83,.12);font-size:21px}
h1{font-size:22px;margin:0;letter-spacing:-.6px}.sub{font-size:11px;color:var(--muted);margin-top:5px}
.nav{display:flex;gap:4px;padding:5px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:14px}
.nav button{border:0;background:transparent;color:#8f958e;padding:9px 13px;border-radius:10px}.nav button.active{background:rgba(255,255,255,.095);color:#fff}
.quote{padding:20px 22px;margin-bottom:12px;position:relative;overflow:hidden}
.quote:before{content:"“";position:absolute;right:16px;top:-26px;font:150px Georgia;color:rgba(57,211,83,.07)}
.quote-kicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:800}
.quote-text{font:italic 22px/1.35 Georgia,serif;max-width:900px;margin-top:7px;position:relative}
.quote-by{font-size:12px;color:#adb4ac;margin-top:10px}.quote-by b{color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:16px 17px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:130px;height:130px;right:-85px;top:-85px;border-radius:50%;background:rgba(57,211,83,.12);filter:blur(7px)}
.num{font-size:27px;font-weight:850;letter-spacing:-1px}.label{color:var(--muted);font-size:11px;margin-top:4px}
.panel{padding:17px;margin-top:12px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.title{font-weight:800;font-size:15px}.hint{color:var(--muted);font-size:11px;margin-top:3px}
.yearnav{display:flex;gap:5px}.icon{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#ddd;border-radius:9px;padding:6px 10px}
.heat-scroll{overflow:auto;padding-bottom:4px}.heat,.months{display:grid;grid-template-columns:30px repeat(53,14px);gap:4px;min-width:982px}.months{margin-bottom:7px}
.month{font-size:10px;color:#858b84}.dow{font-size:9px;color:#6e756e}.cell{width:14px;height:14px;border-radius:3px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.025);cursor:pointer;transition:.15s}
.cell:hover{transform:scale(1.25);outline:1px solid rgba(255,255,255,.25)}
.g1{background:#0d4425}.g2{background:#176936}.g3{background:#20a94c}.g4{background:#39d353}.g5{background:#70eb7d}
.legend{display:flex;align-items:center;gap:5px;color:#7e857d;font-size:10px}.legend i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.045)}.legend i:nth-of-type(2){background:#0d4425}.legend i:nth-of-type(3){background:#176936}.legend i:nth-of-type(4){background:#20a94c}.legend i:nth-of-type(5){background:#39d353}
.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px}.section h2{margin:0;font-size:17px}.section p{margin:4px 0 0;color:var(--muted);font-size:11px}
.habits{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.habit{padding:17px;position:relative;overflow:hidden;border-top:1px solid var(--habit)}
.habit:before{content:"";position:absolute;width:190px;height:190px;right:-105px;top:-110px;border-radius:50%;background:var(--habit);opacity:.12;filter:blur(14px)}
.habithead{display:flex;justify-content:space-between;align-items:center;gap:10px}.habitname{display:flex;align-items:center;gap:9px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:var(--habit);box-shadow:0 0 16px var(--habit)}
.badge{font-size:10px;color:var(--habit);padding:5px 8px;border-radius:99px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.hs{background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.05);border-radius:11px;padding:9px}
.hs b{display:block;font-size:15px}.hs span{font-size:9px;color:var(--muted)}
.mini{height:7px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-top:11px}.mini span{display:block;height:100%;background:var(--habit);box-shadow:0 0 15px var(--habit);border-radius:99px}
.habitfoot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;gap:10px}.tiny{font-size:10px;color:var(--muted)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.055);color:#eee;border-radius:10px;padding:9px 12px}.primary{background:linear-gradient(135deg,#49db61,#13833a);color:#061008;border-color:rgba(255,255,255,.12);font-weight:800;box-shadow:0 9px 28px rgba(57,211,83,.17)}
.empty{padding:32px;text-align:center;color:var(--muted)}
/* detail */
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.back{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#eee;border-radius:10px;padding:9px 12px}
.detail-title{display:flex;align-items:center;gap:10px}.detail-title .bigdot{width:13px;height:13px;border-radius:50%;background:var(--habit);box-shadow:0 0 20px var(--habit)}
.detail-name{font-size:21px;font-weight:850}.detail-goal{font-size:11px;color:var(--muted);margin-top:3px}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bigstat{padding:17px}.bigstat .big{font-size:25px;font-weight:850}.bigstat span{font-size:10px;color:var(--muted)}
  .chart{padding:18px;margin-top:12px}.month-nav{display:grid;grid-template-columns:46px 1fr 46px;gap:12px;align-items:center}
.month-title-wrap{text-align:center}.month-title-wrap .title{margin:0}.month-arrow{height:42px;width:46px;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.035);color:#d9ded9;font-size:27px;line-height:1;cursor:pointer;transition:.16s}
.month-arrow:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}
.month-actions{text-align:center;margin-top:8px}.month-current{border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.035);color:#8f988f;padding:5px 9px;font-size:9px;cursor:pointer}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:15px;padding:0 2px}.weekday-row span{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#666e66;text-align:center}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:7px}
.daybox{position:relative;min-height:78px;padding:10px 9px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.035);overflow:hidden;cursor:pointer;transition:.16s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.012)}
.daybox:before{content:"";position:absolute;inset:0;background:var(--habit);opacity:var(--fill,.02);pointer-events:none}
.daybox:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--habit) 45%,rgba(255,255,255,.1));box-shadow:0 8px 24px rgba(0,0,0,.22),0 0 18px color-mix(in srgb,var(--habit) 12%,transparent)}
.daybox.selected{border-color:var(--habit);box-shadow:0 0 0 2px color-mix(in srgb,var(--habit) 30%,transparent),0 8px 25px rgba(0,0,0,.25)}
.daybox.complete{border-color:color-mix(in srgb,var(--habit) 58%,rgba(255,255,255,.08))}
.daybox.empty-day{visibility:hidden;pointer-events:none;background:transparent;border-color:transparent}
.daybox .daynum,.daybox .dayhours,.daybox .daylabel{position:relative;z-index:1}
.daylabel{font-size:9px;color:#737a73;text-transform:uppercase;letter-spacing:.4px}.daynum{font-size:11px;color:#aeb5ad;margin-top:3px}.dayhours{font-size:16px;font-weight:850;margin-top:9px}
.dayedit{position:absolute;right:8px;bottom:7px;z-index:2;font-size:8px;color:#9ba39b;opacity:.9}
.hours-editor{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:end;margin-top:13px;padding:12px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(0,0,0,.14)}
.hours-editor .editor-label{font-size:10px;color:#8f988f;margin-bottom:5px}.hours-editor .editor-date{font-size:12px;font-weight:800}.hours-editor input{padding:9px 10px}
@media(max-width:700px){.day-grid{grid-template-columns:repeat(4,1fr)}.weekday-row{display:none}.month-nav{grid-template-columns:42px 1fr 42px}.month-arrow{width:42px}.hours-editor{grid-template-columns:1fr 105px auto}}
@media(max-width:430px){.day-grid{grid-template-columns:repeat(2,1fr)}}
.checkpanel{padding:18px;margin-top:12px}.date-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.date-title{font-weight:800}.date-total{font-size:11px;color:var(--muted)}
.todo{display:grid;grid-template-columns:22px 1fr 65px 30px;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.todo input[type=checkbox]{width:17px;height:17px;accent-color:var(--habit)}.todo-text{font-size:13px}.todo.done .todo-text{text-decoration:line-through;color:#687068}
.hourinput{width:65px!important;padding:7px 7px!important;font-size:11px!important}.delete{border:0;background:transparent;color:#777;font-size:16px}
.addtodo{display:grid;grid-template-columns:1fr 75px auto;gap:7px;margin-top:13px}
input[type=text],input[type=number],input[type=date]{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.22);color:#fff;border-radius:10px;padding:10px 11px;outline:0}
input:focus{border-color:rgba(57,211,83,.45);box-shadow:0 0 0 3px rgba(57,211,83,.07)}
/* add */
.addgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:12px}.form,.manage{padding:20px}.form h2,.manage h2{margin:0;font-size:17px}.form p{color:var(--muted);font-size:11px;margin:5px 0 18px}
label{display:block;font-size:11px;color:#b8beb7;margin:13px 0 6px}.colors{display:flex;gap:8px;flex-wrap:wrap}.colorpick{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}.colorpick.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.11)}
.manage-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.mname{display:flex;align-items:center;gap:9px}.mname b{font-size:12px}.mname span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.rowactions{display:flex;gap:5px}.small{padding:7px 9px;font-size:10px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.habits,.addgrid{grid-template-columns:1fr}}
@media(max-width:540px){.app{padding:13px 11px 40px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}.quote{padding:17px}.quote-text{font-size:19px}.stats{gap:8px}.stat{padding:13px}.num{font-size:23px}.detail-stats{gap:7px}.bigstat{padding:13px}.bigstat .big{font-size:21px}.addtodo{grid-template-columns:1fr 65px}.addtodo .btn{grid-column:1/-1}.todo{grid-template-columns:22px 1fr 58px 25px}}

/* Growth + free Jarvis additions */
.growth-grid{display:grid;grid-template-columns:1.25fr .9fr .9fr;gap:12px;margin-top:12px}
.growth-card{padding:18px;min-height:145px}
.growth-card .eyebrow,.jarvis-card .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase}
.growth-main{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:8px}
.growth-score{font-size:46px;font-weight:900;line-height:1;letter-spacing:-.04em}
.growth-rate{font-size:18px;font-weight:800}
.progress-line{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:15px}
.progress-line span{display:block;height:100%;width:0;background:var(--habit,var(--green));border-radius:inherit;transition:width .35s}
.momentum{font-size:34px;font-weight:900;margin-top:12px}
.momentum.good{color:var(--green)}
.momentum.warn{color:#f0c36a}
.momentum.bad{color:#f85149}
.pr-list{margin-top:10px;display:grid;gap:7px;max-height:100px;overflow:auto}
.pr-item{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.035);font-size:12px}
.jarvis-card{padding:18px;margin-top:12px}
.jarvis-row{display:flex;gap:10px;align-items:center;margin-top:12px}
.jarvis-input{flex:1;min-width:0;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);outline:none}
.jarvis-input:focus{border-color:rgba(57,211,83,.45)}
.jarvis-btn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(57,211,83,.35);background:rgba(57,211,83,.10);color:var(--text);font-size:20px}
.jarvis-btn.listening{background:rgba(248,81,73,.16);border-color:rgba(248,81,73,.5);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 7px rgba(248,81,73,.06)}}
.jarvis-response{margin-top:12px;min-height:38px;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.035);font-size:13px;line-height:1.5}
.jarvis-note{font-size:11px;color:var(--muted);margin-top:8px}
.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.coach-card{padding:18px}
.insight{padding:10px 12px;border-left:2px solid var(--green);background:rgba(57,211,83,.045);border-radius:0 9px 9px 0;margin-top:9px;font-size:13px;line-height:1.45}
.xp-wrap{display:flex;align-items:center;gap:10px;margin-top:10px}
.level-badge{font-weight:900;padding:5px 9px;border-radius:99px;background:rgba(163,113,247,.12);border:1px solid rgba(163,113,247,.24)}
.xpbar{flex:1;height:7px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.xpbar span{display:block;height:100%;background:#a371f7;width:0}
.goal-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.goal-row:last-child{border-bottom:0}
.goal-date{color:var(--muted)}
.small-muted{font-size:11px;color:var(--muted)}
@media(max-width:900px){.growth-grid{grid-template-columns:1fr 1fr}.growth-card:first-child{grid-column:1/-1}}
@media(max-width:600px){.growth-grid,.coach-grid{grid-template-columns:1fr}.growth-card:first-child{grid-column:auto}.jarvis-row{align-items:stretch}.jarvis-btn{flex:0 0 48px}}

</style>




<style>
/* ===== Momentum: green glass + glow ===== */
:root{
  --bg:#070908;--bg2:#0c100d;--panel:rgba(20,25,21,.58);--panel2:rgba(12,16,13,.72);
  --line:rgba(255,255,255,.085);--text:#f5f7f1;--muted:#8f988f;
  --green:#39d353;--green2:#14863a;
}
body{
  background:
    radial-gradient(900px 520px at 8% -5%,rgba(57,211,83,.15),transparent 60%),
    radial-gradient(700px 480px at 100% 18%,rgba(57,211,83,.07),transparent 62%),
    radial-gradient(600px 440px at 55% 100%,rgba(57,211,83,.045),transparent 65%),
    linear-gradient(145deg,#050705,#0b100c 52%,#070907);
}
.glass{
  background:linear-gradient(145deg,rgba(25,32,26,.54),rgba(10,15,11,.48));
  border:1px solid rgba(255,255,255,.09);
  box-shadow:
    0 22px 70px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.055),
    0 0 38px rgba(57,211,83,.025);
  backdrop-filter:blur(28px) saturate(125%);
  -webkit-backdrop-filter:blur(28px) saturate(125%);
}
.top{margin-bottom:14px}
.logo{
  background:linear-gradient(145deg,rgba(57,211,83,.22),rgba(57,211,83,.035));
  border-color:rgba(57,211,83,.3);
  box-shadow:0 0 36px rgba(57,211,83,.14),inset 0 1px rgba(255,255,255,.08);
}
.logo span{color:#8bff9a}
.nav{background:rgba(255,255,255,.025);backdrop-filter:blur(18px)}
.nav button.active{background:rgba(57,211,83,.09);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.05)}
.quote{box-shadow:0 24px 80px rgba(0,0,0,.32),0 0 55px rgba(57,211,83,.035),inset 0 1px rgba(255,255,255,.055)}
.quote-kicker{color:#67ed7c}
.stat:after{background:rgba(57,211,83,.16);filter:blur(12px)}
.panel,.habit,.growth-card,.coach-card,.money-total,.money-summary,.money-history{box-shadow:0 18px 65px rgba(0,0,0,.27),0 0 35px rgba(57,211,83,.022),inset 0 1px rgba(255,255,255,.045)}
.money-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-top:12px}
.money-total{padding:22px;position:relative;overflow:hidden}
.money-total:after{content:"";position:absolute;width:280px;height:180px;right:-90px;top:-100px;background:radial-gradient(circle,rgba(57,211,83,.19),transparent 68%);filter:blur(5px)}
.money-kicker{font-size:9px;letter-spacing:.18em;color:#73e989;font-weight:850}
.money-main{font-size:42px;font-weight:900;letter-spacing:-1.8px;margin-top:8px;position:relative}
.money-usd{font-size:17px;color:#a9b1aa;margin-top:5px;position:relative}
.money-note{font-size:10px;color:var(--muted);margin-top:12px;position:relative}
.money-summary{padding:14px 17px}
.money-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.money-row:last-child{border-bottom:0}
.money-row span{color:var(--muted)}
.money-row b{font-size:13px}
.money-history{padding:16px;margin-top:12px}
.money-entry{display:grid;grid-template-columns:110px 1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.money-entry-date{font-size:10px;color:var(--muted)}
.money-entry-reason{font-size:12px}
.money-entry-amount{text-align:right;font-weight:850;color:#78ee8a}
.money-delete{border:0;background:transparent;color:#707870;font-size:17px}
.money-empty{padding:22px 0;text-align:center;color:var(--muted);font-size:11px}
.money-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.money-form label{margin:0}
.money-form .full{grid-column:1/-1}
@media(max-width:700px){
  .money-grid{grid-template-columns:1fr}
  .money-entry{grid-template-columns:82px 1fr auto}
  .money-entry .money-delete{grid-column:3;grid-row:1}
}
@media(max-width:500px){.money-form{grid-template-columns:1fr}.money-form .full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="logo"><span>✦</span></div>
    <div><h1>Momentum<span class="brand-dot">.</span></h1><div class="sub">Personal operating system</div></div>
  </div>
  <nav class="nav">
    <button id="overallTab" class="active" onclick="show('overall')"><span>⌂</span> Overview</button>
    <button id="addTab" onclick="show('add')"><span>＋</span> Add field</button>
  </nav>
</header>

<section class="glass quote ai-brief">
  <div class="brief-glow"></div>
  <div class="quote-kicker">DAILY INTELLIGENCE</div>
  <div class="quote-text" id="quoteText"></div>
  <div class="quote-by">Insight from your momentum system · <b id="quoteAuthor"></b></div>
  <div class="brief-chip">✦ Personal context</div>
</section>

<main id="overallPage">
<section class="stats">
    <div class="glass stat"><div class="
